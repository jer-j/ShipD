name: JAX Constraints Validation

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-jax-constraints:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "jax[cpu]"

      - name: Run JAX constraint validation
        run: |
          python validate_jax_constraints.py --index 0
          python validate_jax_constraints.py --index 1
          python validate_jax_constraints.py --index 2
